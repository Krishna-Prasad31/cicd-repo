
name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build and publish AMD64 image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: tacituskilgore/cicd-app:latest

      # Step 5: Deploy to EC2 through SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull tacituskilgore/cicd-app:latest
            sudo docker stop cicd-app || true
            sudo docker rm cicd-app || true
            sudo docker run -d \
              --name cicd-app \
              --restart unless-stopped \
              -p 80:80 \
              tacituskilgore/cicd-app:latest
