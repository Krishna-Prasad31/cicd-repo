
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Deployment not an experiment anymore</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            padding: 40px;
        }

        h1 {
            font-size: 42px;
            color: #60a5fa;
        }

        p {
            color: #cbd5e1;
            font-size: 18px;
        }

        .status {
            display: inline-block;
            background: #14532d;
            color: #86efac;
            padding: 10px 20px;
            border-radius: 20px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>CI/CD Pipeline 🚀</h1>

        <p>
            Automatically deployed using
            GitHub Actions, Docker and AWS EC2.
        </p>

        <div class="status">
            Application is running successfully! TechnoBlade never dies
        </div>
    </div>
</body>
</html>
